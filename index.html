<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raylos’Clo</title>
<meta name="theme-color" content="#F8F4E7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Raylos’Clo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>

<!-- ============ LOGIN ============ -->
<main id="login">
  <header class="topbar"><span class="logo"><img class="cat" src="assets/cat.png" alt="Raylos’Clo"></span></header>
  <div class="login-body">
    <div class="login-art">
      <img src="assets/rack.png" alt="Hand-drawn clothing rack with a coat, a dress and a jacket, and a small cat sitting beside it">
    </div>
    <div class="login-panel">
      <img class="login-word" src="assets/wordmark.png" alt="Raylos’Clo">
      <h1 class="hello-text">hello</h1>
      <p class="sub">Log in to see your closet.</p>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="you@email.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••">
        </div>
        <div class="row-links"><button type="button" class="linkbtn" id="forgotBtn">Forgot password?</button></div>
        <p class="error" id="loginError" role="alert"></p>
        <button type="submit" class="go">Log in &rarr;</button>
      </form>
      <p class="note">Demo login: any email and password will work. <button type="button" class="linkbtn" id="demoBtn">Use the demo account</button></p>
      <p class="login-foot">New here? <button type="button" class="linkbtn" id="signupBtn">Create an account</button></p>
    </div>
  </div>
</main>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <header class="apphead">
    <div class="ah-left"><span class="who" id="who"></span><span class="syncstat" id="syncStat" role="status"></span></div>
    <a class="ah-logo" href="#dashboard" aria-label="Raylos’Clo, go to dashboard"><img src="assets/cat.png" alt=""></a>
    <div class="ah-right"><button type="button" id="logoutBtn">Log out</button></div>
  </header>
  <nav class="nav" aria-label="Main">
    <button data-view="dashboard"><span class="nl">Dashboard</span><span class="ns" aria-hidden="true">Home</span></button>
    <button data-view="items"><span class="nl">Items</span><span class="ns" aria-hidden="true">Items</span></button>
    <button data-view="sold-shipping"><span class="nl">Sold <span class="amp">&amp;</span> Shipping</span><span class="ns" aria-hidden="true">Sold</span><span class="nb"><span class="badge" data-badge="ship" hidden></span><span class="badge hot" data-badge="delist" hidden></span></span></button>
    <button data-view="money"><span class="nl">Money</span><span class="ns" aria-hidden="true">Money</span></button>
    <button data-view="notifications"><span class="nl">Notifications</span><span class="ns" aria-hidden="true">Alerts</span><span class="nb"><span class="badge" data-badge="notes" hidden></span></span></button>
    <button data-view="settings"><span class="nl">Settings</span><span class="ns" aria-hidden="true">Settings</span></button>
  </nav>
  <div class="main" id="mainArea">
    <section data-panel="dashboard"></section>
    <section data-panel="items" hidden></section>
    <section data-panel="sold-shipping" hidden></section>
    <section data-panel="money" hidden></section>
    <section data-panel="notifications" hidden></section>
    <section data-panel="settings" hidden></section>
  </div>
  <footer class="foot k">resell &middot; list &middot; grow</footer>
</div>

<dialog id="itemDlg" aria-label="Item"></dialog>
<dialog id="soldDlg" aria-label="Mark as sold"></dialog>
<dialog id="shipDlg" aria-label="Mark as shipped"></dialog>
<dialog id="kitDlg" class="kit" aria-label="Listing kit"></dialog>
<dialog id="pasteDlg" class="kit" aria-label="Paste a sale"></dialog>
<dialog id="replyDlg" class="kit" aria-label="Reply to a buyer"></dialog>
<dialog id="gmailDlg" class="kit" aria-label="Check Gmail"></dialog>
<dialog id="camDlg" class="camdlg" aria-label="Camera"></dialog>
<dialog id="delistDlg" class="kit" aria-label="Take these down now"></dialog>
<input type="file" id="receiptCam" accept="image/*" capture="environment" hidden>
<input type="file" id="receiptPick" accept="image/*,.heic,.heif" hidden>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<div id="dropHint">Drop a photo on an item to add it, or anywhere here to start a new item</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="js/core.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/items.js"></script>
<script src="js/kit.js"></script>
<script src="js/sheet.js"></script>
<script src="js/paste.js"></script>
<script src="js/gmail.js"></script>
<script src="js/attention.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/camera.js"></script>
<script src="js/receipt.js"></script>
<script src="js/fields.js"></script>
<script src="js/sold.js"></script>
<script src="js/money.js"></script>
<script src="js/notifications.js"></script>
<script src="js/settings.js"></script>
<script src="js/mock.js"></script>
<script src="js/events.js"></script>
<script src="js/cloud.js"></script>
<script src="js/auth.js"></script>
<script src="js/start.js"></script>
</body>
</html>
