<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raylos’Clo</title>
<link rel="preload" href="assets/fonts/karumbi.woff" as="font" type="font/woff" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/charts.css">
<link rel="stylesheet" href="css/photos.css">
<link rel="stylesheet" href="css/kit.css">
<link rel="stylesheet" href="css/motion.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<!-- ============ LOGIN ============ -->
<main id="login">
  <header class="topbar"><span class="logo"><img class="cat" src="assets/img/logo-cat.png" alt="Raylos’Clo"></span></header>
  <div class="login-body">
    <div class="login-art">
      <img src="assets/img/rack.png" alt="Hand-drawn clothing rack with a coat, a dress and a jacket, and a small cat sitting beside it">
    </div>
    <div class="login-panel">
      <img class="login-word" src="assets/img/wordmark.png" alt="Raylos’Clo">
      <h1 class="hello-text">hello</h1>
      <p class="sub">Log in to see your closet.</p>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="you@email.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••">
        </div>
        <div class="row-links"><button type="button" class="linkbtn" id="forgotBtn">Forgot password?</button></div>
        <p class="error" id="loginError" role="alert"></p>
        <button type="submit" class="go">Log in<span class="arr" aria-hidden="true"> &rarr;</span></button>
      </form>
      <p class="note">Demo login: any email and password will work. <button type="button" class="linkbtn" id="demoBtn">Use the demo account</button></p>
      <p class="login-foot">New here? <button type="button" class="linkbtn" id="signupBtn">Create an account</button></p>
    </div>
  </div>
</main>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <div class="appframe">
    <aside class="side">
      <a class="side-logo" href="#dashboard" aria-label="Raylos’Clo, go to dashboard"><img class="side-cat" src="assets/img/logo-cat.png" alt=""><img class="side-word" src="assets/img/wordmark.png" alt=""></a>
      <div class="side-user"><span class="avatar" id="avatar" aria-hidden="true"></span><div class="ah-left"><span class="who" id="who"></span><span class="syncstat" id="syncStat" role="status"></span></div></div>
      <nav class="nav" aria-label="Main">
        <button data-view="dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg><span class="lbl">Dashboard</span></button>
        <button data-view="items"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5.5a2 2 0 1 1 2 2c-.6 0-.9.5-.9 1v1M12 9.5 3.6 15.4c-.9.7-.5 2.1.7 2.1h15.4c1.2 0 1.6-1.4.7-2.1L12 9.5"/></svg><span class="lbl">Items</span></button>
        <button data-view="sold-shipping"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.8 12 3.8l8.5 4v8.6L12 20.4l-8.5-4z"/><path d="M3.5 7.8 12 11.9l8.5-4.1M12 11.9v8.5M7.7 5.8l8.6 4.1"/></svg><span class="lbl">Sold <span class="amp">&amp;</span> Shipping</span><span class="badge" data-badge="ship" hidden></span><span class="badge hot" data-badge="delist" hidden></span></button>
        <button data-view="money"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6.5" width="18" height="13" rx="3"/><path d="M16 13h2.5M6 6.5l9-2.7a1.5 1.5 0 0 1 1.9 1.4v1.3"/></svg><span class="lbl">Money</span></button>
        <button data-view="notifications"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 3.5V16A2.5 2.5 0 0 1 4 13.5z"/><path d="M8 9h8M8 12h5"/></svg><span class="lbl">Notifications</span><span class="badge" data-badge="notes" hidden></span></button>
        <button data-view="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span class="lbl">Settings</span></button>
      </nav>
      <button type="button" id="logoutBtn" class="side-out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4.5H7A2.5 2.5 0 0 0 4.5 7v10A2.5 2.5 0 0 0 7 19.5h7"/><path d="M11 12h9m-3.5-3.5L20 12l-3.5 3.5"/></svg><span class="lbl">Log out</span></button>
    </aside>
    <div class="content">
      <header class="apphead">
        <form class="gsearch" id="gSearch" role="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><label class="sr" for="gQ">Search your items</label><input type="search" id="gQ" placeholder="Search your closet" autocomplete="off"></form>
        <div class="ah-right"><button type="button" class="iconbtn" id="bellBtn" aria-label="Notifications"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 16.5V11a5.5 5.5 0 0 1 11 0v5.5l1.5 2h-14z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><span class="badge" data-badge="notes" hidden></span></button></div>
      </header>
      <div class="main" id="mainArea">
        <section data-panel="dashboard"></section>
        <section data-panel="items" hidden></section>
        <section data-panel="sold-shipping" hidden></section>
        <section data-panel="money" hidden></section>
        <section data-panel="notifications" hidden></section>
        <section data-panel="settings" hidden></section>
      </div>
      <footer class="foot k">resell &middot; list &middot; grow</footer>
    </div>
  </div>
</div>

<dialog id="itemDlg" aria-label="Item"></dialog>
<dialog id="soldDlg" aria-label="Mark as sold"></dialog>
<dialog id="shipDlg" aria-label="Mark as shipped"></dialog>
<dialog id="kitDlg" class="kit" aria-label="Listing kit"></dialog>
<dialog id="pasteDlg" class="kit" aria-label="Paste a sale"></dialog>
<dialog id="replyDlg" class="kit" aria-label="Reply to a buyer"></dialog>
<dialog id="gmailDlg" class="kit" aria-label="Check Gmail"></dialog>
<dialog id="delistDlg" class="kit" aria-label="Take these down now"></dialog>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<div id="dropHint">Drop a photo on an item to add it, or anywhere here to start a new item</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="js/app.js"></script>
</body>
</html>
